[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twitch-bot"
version = "0.1.0"
description = "Twitch-бот на TwitchIO 3 (AutoBot), PostgreSQL и компонентной архитектуре."
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "d43m0n4rch7", email = "d43m0n4rch7@gmail.com" },
]
keywords = [
    "twitch",
    "twitchio",
    "bot",
    "eventsub",
    "oauth",
    "asyncpg",
    "postgresql",
    "chat-bot",
    "component",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "asyncpg>=0.31.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.0",
    "twitchio[starlette]>=3.3.2,<4.0.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.0",
]

[project.scripts]
twitch-bot = "twitch_bot.main:main"

[project.urls]
Homepage = "https://github.com/d43m0n4rch7/twitch-bot"
Repository = "https://github.com/d43m0n4rch7/twitch-bot"
Issues = "https://github.com/d43m0n4rch7/twitch-bot/issues"

[tool.uv]
default-groups = ["dev"]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/twitch_bot"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]
preview = false
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "ANN",
    "D",
    "Q",
]
ignore = [
    "D100",
    "D104",
    "ANN401",
]
flake8-annotations.allow-star-arg-any = true
flake8-quotes.inline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["twitch_bot"]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
